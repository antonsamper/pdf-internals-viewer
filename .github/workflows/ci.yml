name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Serialize runs for each branch to prevent overlapping production uploads.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner'
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Documentation-only changes skip the build, tests and deploy. Any file
      # outside these patterns, or a diff that cannot be computed, runs everything.
      # On main the diff starts at the last successful run, so a merge whose run
      # failed or was cancelled is still tested and deployed by the next one.
      - name: Detect code changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty') || base=
          fi
          echo "Base: ${base:-(none found)}"
          code=true
          if [ -n "$base" ] && files=$(git diff --name-only --no-renames "$base...$HEAD") && [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                public/* | src/*) code=true; break ;;
                *.md | docs/* | .github/ISSUE_TEMPLATE/* | LICENSE) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "Changed files:"
          echo "${files:-(none found)}"
          echo "Run code checks: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:pages-assets
  browsers:
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build
      - run: pnpm run test:e2e --browser=${{ matrix.browser }}
        env:
          PLAYWRIGHT_CLOUDFLARE: '1'
      - name: Verify parser in native development workers
        run: pnpm run test:e2e --browser=${{ matrix.browser }} --grep 'follows page references|uploads and replaces|distinguishes compressed'
  # The one required status check: it passes when every job above passed or
  # was skipped for a documentation-only change.
  passed:
    name: Checks passed
    needs: [secrets, changes, check, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # check and browsers may skip only when changes found no code.
          failed=$(jq -r '.changes.outputs.code as $code | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or $code == "true" or .key == "secrets" or .key == "changes")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not pass: $(tr '\n' ' ' <<< "$failed")"
            exit 1
          fi
  deploy:
    name: Deploy production
    needs: [secrets, check, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/HOSTING.md."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Check native notices
        run: pnpm run check:native-notices
      - name: Build and publish to Cloudflare Pages
        run: |
          pnpm run deploy:check
          pnpm exec wrangler pages deploy dist --project-name pdf-internals-viewer --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production responds
        run: curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 https://pdf-internals-viewer.pages.dev/ --output /dev/null
