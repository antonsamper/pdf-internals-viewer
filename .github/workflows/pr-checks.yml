name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  format:
    name: Title and ticket link
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          node scripts/check-title.mjs "$TITLE"
          [[ "$TITLE" =~ ^\[PIV-([0-9]+)\] ]]
          issue="${BASH_REMATCH[1]}"
          if ! grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #${issue}([^0-9]|$)" <<< "$BODY"; then
            echo "::error::The description must contain 'Closes #${issue}' to match the title."
            exit 1
          fi
