name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  format:
    name: Title and ticket link
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^\[PIV-([0-9]+)\] (feat|fix|chore|docs|ci|test|perf|refactor)(\((inspector|site|search|infra|brand)\))?: [a-z0-9]([^A-Z]*[^A-Z.])?$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Title must match '[PIV-<issue>] type(scope): summary', with an all-lowercase summary. See AGENTS.md."
            exit 1
          fi
          issue="${BASH_REMATCH[1]}"
          if (( ${#TITLE} > 72 )); then
            echo "::error::Title is ${#TITLE} characters. The limit is 72."
            exit 1
          fi
          if ! grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #${issue}([^0-9]|$)" <<< "$BODY"; then
            echo "::error::The description must contain 'Closes #${issue}' to match the title."
            exit 1
          fi
